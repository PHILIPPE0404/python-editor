<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Cloud Studio</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>

    <style>
        :root {
            --bg-main: #181825;
            --bg-sidebar: #1e1e2e;
            --bg-editor: #1e1e2e;
            --bg-console: #11111b;
            --bg-header: #11111b;
            --accent-blue: #89b4fa;
            --accent-green: #a6e3a1;
            --accent-red: #f38ba8;
            --accent-yellow: #f9e2af;
            --border-color: #313244;
            --text-main: #cdd6f4;
            --text-dim: #a6adc8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header { background: var(--bg-header); border-bottom: 1px solid var(--border-color); height: 50px; display: flex; align-items: center; padding: 0 15px; gap: 10px; z-index: 100; }
        .logo { font-weight: 700; font-size: 16px; color: var(--accent-blue); display: flex; align-items: center; gap: 8px; margin-right: 10px; }
        
        .btn { background: #313244; color: var(--text-main); border: 1px solid #45475a; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }
        .btn:hover { background: #45475a; color: #fff; }
        .btn-success { background: #234731; color: var(--accent-green); border-color: #2e5c3e; }
        .btn-danger { background: #52232d; color: var(--accent-red); border-color: #6b2d3b; }

        .project-title { background: #252538; border: 1px solid var(--border-color); color: var(--text-main); font-weight: 600; font-size: 13px; padding: 6px 10px; border-radius: 6px; width: 200px; }
        .project-title:focus { border-color: var(--accent-blue); outline: none; }

        .ide-container { flex: 1; display: flex; height: calc(100vh - 75px); position: relative; }

        .sidebar { width: 260px; background: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .sidebar-header { padding: 10px 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-dim); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: #161622; }
        .file-tree { flex: 1; overflow-y: auto; padding: 6px 0; }
        
        .file-item { padding: 8px 12px; font-size: 13px; color: var(--text-main); cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; border-left: 3px solid transparent; }
        .file-item:hover { background: #2a2b3d; }
        .file-item.active { background: #313244; border-left-color: var(--accent-blue); font-weight: 600; }
        .file-item.is-entrypoint { color: var(--accent-yellow); }
        
        .file-actions { display: none; gap: 8px; }
        .file-item:hover .file-actions { display: flex; }
        .file-actions i { font-size: 12px; color: var(--text-dim); }
        .file-actions i:hover { color: #fff; }
        .file-actions i.delete-icon:hover { color: var(--accent-red); }

        .project-item { padding: 8px 12px; font-size: 12px; color: var(--text-main); cursor: pointer; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #28283a; }
        .project-item:hover { background: #2a2b3d; }
        .project-item.active-proj { background: #313244; color: var(--accent-blue); font-weight: bold; }

        .workspace { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); overflow: hidden; }

        .tabs-bar { height: 38px; background: var(--bg-header); border-bottom: 1px solid var(--border-color); display: flex; overflow-x: auto; align-items: center; }
        .tab { height: 100%; padding: 0 16px; background: #181825; color: var(--text-dim); border-right: 1px solid var(--border-color); font-size: 13px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .tab.active { background: var(--bg-editor); color: var(--accent-blue); border-top: 2px solid var(--accent-blue); font-weight: 500; }
        .tab-close:hover { color: var(--accent-red); }

        .editor-container { flex: 6; position: relative; width: 100%; height: 100%; }
        #monaco-editor { width: 100%; height: 100%; }

        .console-panel { flex: 4; background: var(--bg-console); border-top: 1px solid var(--border-color); display: flex; flex-direction: column; position: relative; }
        .console-header { height: 35px; background: #181825; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); font-size: 12px; font-weight: 600; color: var(--text-dim); }
        
        .console-output { flex: 1; padding: 12px; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; color: var(--accent-green); }
        
        .input-waiting-banner { display: none; background: #3e3312; color: var(--accent-yellow); border-top: 1px solid var(--accent-yellow); padding: 6px 12px; font-size: 12px; font-weight: bold; align-items: center; gap: 8px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }

        .console-input-bar { display: flex; border-top: 1px solid var(--border-color); background: #181825; padding: 8px 12px; gap: 8px; align-items: center; }
        .console-input-bar.active-waiting { background: #2d2611; border-top-color: var(--accent-yellow); }
        .console-prompt { color: var(--accent-yellow); font-family: monospace; font-weight: bold; }
        .console-input { flex: 1; background: #11111b; border: 1px solid var(--border-color); color: #fff; padding: 8px 12px; border-radius: 4px; font-family: monospace; font-size: 13px; outline: none; }
        .console-input:focus { border-color: var(--accent-blue); }
        .console-input-bar.active-waiting .console-input { border-color: var(--accent-yellow); box-shadow: 0 0 8px rgba(249, 226, 175, 0.3); }

        .workspace.mode-editor .console-panel { display: none !important; }
        .workspace.mode-editor .editor-container { flex: 1 !important; }
        
        .workspace.mode-console .editor-container, .workspace.mode-console .tabs-bar { display: none !important; }
        .workspace.mode-console .console-panel { flex: 1 !important; }

        .error-card { background: #2a1b24; border: 1px solid #f38ba8; border-radius: 6px; padding: 12px; margin: 10px 0; color: #f38ba8; font-family: sans-serif; font-size: 13px; }
        .error-card-header { display: flex; justify-content: space-between; align-items: center; font-weight: 700; margin-bottom: 6px; }
        .error-copy-btn { background: #f38ba8; color: #11111b; border: none; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .error-copy-btn:hover { background: #fff; }

        footer { height: 25px; background: #11111b; border-top: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; font-size: 11px; color: var(--text-dim); }

        .error-line-highlight { background: rgba(243, 139, 168, 0.3) !important; width: 100% !important; border-left: 3px solid var(--accent-red); }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--bg-sidebar); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; width: 400px; color: var(--text-main); }
        .modal-content input { width: 100%; padding: 8px; background: var(--bg-main); border: 1px solid var(--border-color); color: #fff; border-radius: 4px; margin: 12px 0; }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <i class="fa-brands fa-python"></i> Python Studio
    </div>
    
    <input type="text" id="project-name" class="project-title" value="Mon Projet Python">
    
    <button class="btn btn-success" onclick="runProject()">
        <i class="fa-solid fa-play"></i> Exécuter
    </button>
    <button class="btn btn-danger" onclick="stopExecution()">
        <i class="fa-solid fa-stop"></i> Arrêter
    </button>
    <button class="btn" onclick="saveProjectToDB()">
        <i class="fa-solid fa-floppy-disk"></i> Sauvegarder
    </button>
    <button class="btn" onclick="createNewProject()">
        <i class="fa-solid fa-folder-plus"></i> Nouveau
    </button>
    <button class="btn" onclick="openPipModal()">
        <i class="fa-solid fa-box"></i> Installer Package
    </button>

    <div style="margin-left: auto; display: flex; gap: 6px;">
        <button class="btn" onclick="setViewMode('split')" title="Vue Divisée">
            <i class="fa-solid fa-columns"></i> Vue Divisée
        </button>
        <button class="btn" onclick="setViewMode('editor')" title="Éditeur Fullscreen">
            <i class="fa-solid fa-expand"></i> Éditeur
        </button>
        <button class="btn" onclick="setViewMode('console')" title="Console Fullscreen">
            <i class="fa-solid fa-terminal"></i> Console
        </button>
    </div>
</header>

<div class="ide-container">
    <div class="sidebar">
        <div class="sidebar-header">
            <span>Fichiers du Projet</span>
            <i class="fa-solid fa-file-circle-plus" style="cursor:pointer;" onclick="promptNewFile()" title="Nouveau Fichier"></i>
        </div>
        <div class="file-tree" id="file-tree"></div>

        <div class="sidebar-header">
            <span>Projets Enregistrés (BDB)</span>
        </div>
        <div class="file-tree" id="project-list" style="max-height: 200px;"></div>
    </div>

    <div class="workspace" id="workspace">
        <div class="tabs-bar" id="tabs-bar"></div>

        <div class="editor-container" id="editor-container">
            <div id="monaco-editor"></div>
        </div>

        <div class="console-panel" id="console-panel">
            <div class="console-header">
                <span><i class="fa-solid fa-terminal"></i> CONSOLE INTERACTIVE</span>
                <button class="btn" style="padding: 2px 8px; font-size: 11px;" onclick="clearConsole()">
                    <i class="fa-solid fa-trash-can"></i> Effacer
                </button>
            </div>
            
            <div class="console-output" id="console-output">Cliquez sur [Exécuter] pour démarrer...</div>
            
            <div class="input-waiting-banner" id="input-waiting-banner">
                <i class="fa-solid fa-keyboard"></i> Python est en pause : il attend votre saisie ci-dessous ! Appuyez sur Entrée pour valider.
            </div>

            <div class="console-input-bar" id="console-input-bar">
                <span class="console-prompt">❯</span>
                <input type="text" id="console-input" class="console-input" placeholder="Saisir votre réponse ici puis appuyer sur Entrée..." onkeypress="handleInputKeyPress(event)">
                <button class="btn btn-success" style="padding: 6px 14px;" onclick="sendConsoleInput()">Envoyer</button>
            </div>
        </div>
    </div>
</div>

<footer>
    <div id="status-text">
        <i class="fa-solid fa-circle" style="color: var(--accent-green); font-size: 8px;"></i> Prêt
    </div>
    <div id="entrypoint-status">
        <i class="fa-solid fa-rocket"></i> Entrée: main.py
    </div>
    <div id="syntax-status">
        <i class="fa-solid fa-check-double"></i> Syntaxe OK
    </div>
</footer>

<div class="modal" id="pip-modal">
    <div class="modal-content">
        <h3>Installer une bibliothèque Pip</h3>
        <input type="text" id="pip-package-input" placeholder="ex: requests, pandas, numpy">
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <button class="btn" onclick="closePipModal()">Annuler</button>
            <button class="btn btn-success" onclick="installPipPackage()">Installer</button>
        </div>
    </div>
</div>

<script>
    let currentProjectId = null;
    let entrypointFile = 'main.py';
    let files = {
        'main.py': '# Fichier principal\nimport utils\n\nname = input("Quel est votre prénom ? ")\nprint(f"Bonjour {name} !")\n\nage = input("Quel âge avez-vous ? ")\nprint(f"L\'année prochaine vous aurez {int(age)+1} ans.")\n\nprint("Résultat calcul :", utils.add(10, 20))\n',
        'utils.py': '# Module auxiliaire\ndef add(a, b):\n    return a + b\n'
    };
    let activeFile = 'main.py';
    let monacoEditor = null;
    let fileModels = {};
    let errorDecorations = [];
    let currentProcessId = null;
    let pollInterval = null;
    let fullConsoleHistory = "";

    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' }});
    require(['vs/editor/editor.main'], function() {
        monacoEditor = monaco.editor.create(document.getElementById('monaco-editor'), {
            theme: 'vs-dark',
            language: 'python',
            automaticLayout: true,
            fontSize: 14,
            fontFamily: "Consolas, monospace",
            minimap: { enabled: true },
            quickSuggestions: true,
            suggestOnTriggerCharacters: true
        });

        initModels();
        renderFileTree();
        renderTabs();
        loadProjectList();
        checkSyntax();

        // Automatic Layout Observer
        new ResizeObserver(() => {
            if (monacoEditor) monacoEditor.layout();
        }).observe(document.getElementById('editor-container'));
    });

    function initModels() {
        for (let fname in fileModels) {
            fileModels[fname].dispose();
        }
        fileModels = {};
        for (let fname in files) {
            fileModels[fname] = monaco.editor.createModel(files[fname], 'python');
        }
        if (!files[activeFile]) {
            activeFile = Object.keys(files)[0] || 'main.py';
        }
        monacoEditor.setModel(fileModels[activeFile]);

        monacoEditor.onDidChangeModelContent(() => {
            files[activeFile] = monacoEditor.getValue();
            debounceSyntaxCheck();
        });
    }

    async function runProject() {
        if (!monacoEditor) return;
        files[activeFile] = monacoEditor.getValue();

        stopExecution();
        clearErrorHighlight();
        setWaitingInputState(false);
        
        const consoleOut = document.getElementById('console-output');
        consoleOut.innerText = `⚡ Démarrage (${entrypointFile})...\n`;
        fullConsoleHistory = consoleOut.innerText;
        
        document.getElementById('status-text').innerHTML = `<i class="fa-solid fa-spinner fa-spin" style="color: var(--accent-yellow);"></i> En cours...`;

        const res = await fetch('/api/start', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                files: files,
                entrypoint: entrypointFile
            })
        });

        const data = await res.json();
        if (data.process_id) {
            currentProcessId = data.process_id;
            pollInterval = setInterval(pollProcessOutput, 150);
        } else {
            consoleOut.innerText = "Erreur au démarrage: " + (data.error || "Inconnu");
            document.getElementById('status-text').innerHTML = `<i class="fa-solid fa-circle" style="color: var(--accent-red); font-size: 8px;"></i> Erreur`;
        }
    }

    async function pollProcessOutput() {
        if (!currentProcessId) return;

        const res = await fetch(`/api/poll/${currentProcessId}`);
        if (!res.ok) return;

        const data = await res.json();
        const consoleOut = document.getElementById('console-output');

        if (data.output) {
            consoleOut.innerText += data.output;
            fullConsoleHistory += data.output;
            consoleOut.scrollTop = consoleOut.scrollHeight;
        }

        if (data.status === 'running') {
            const text = consoleOut.innerText;
            if (text && !text.endsWith('\n')) {
                setWaitingInputState(true);
            } else {
                setWaitingInputState(false);
            }
        } else if (data.status === 'finished') {
            clearInterval(pollInterval);
            pollInterval = null;
            setWaitingInputState(false);
            
            if (data.returncode !== 0) {
                if (data.error_line) {
                    highlightErrorLine(data.error_line);
                }
                renderErrorCard(data.error_msg || "Une erreur s'est produite lors de l'exécution.");
            }

            document.getElementById('status-text').innerHTML = `<i class="fa-solid fa-circle" style="color: ${data.returncode === 0 ? 'var(--accent-green)' : 'var(--accent-red)'}; font-size: 8px;"></i> ${data.returncode === 0 ? 'Terminé' : 'Erreur'}`;
            currentProcessId = null;
        }
    }

    function setWaitingInputState(isWaiting) {
        const banner = document.getElementById('input-waiting-banner');
        const inputBar = document.getElementById('console-input-bar');
        const inputEl = document.getElementById('console-input');

        if (isWaiting) {
            banner.style.display = 'flex';
            inputBar.classList.add('active-waiting');
            inputEl.focus();
        } else {
            banner.style.display = 'none';
            inputBar.classList.remove('active-waiting');
        }
    }

    async function sendConsoleInput() {
        const inputEl = document.getElementById('console-input');
        const text = inputEl.value;
        if (!currentProcessId) return;

        inputEl.value = '';
        setWaitingInputState(false);

        await fetch(`/api/input/${currentProcessId}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ input: text })
        });
    }

    function handleInputKeyPress(e) {
        if (e.key === 'Enter') sendConsoleInput();
    }

    async function stopExecution() {
        if (pollInterval) {
            clearInterval(pollInterval);
            pollInterval = null;
        }
        if (currentProcessId) {
            await fetch(`/api/stop/${currentProcessId}`, { method: 'POST' });
            currentProcessId = null;
        }
        setWaitingInputState(false);
        document.getElementById('status-text').innerHTML = `<i class="fa-solid fa-circle" style="color: var(--accent-red); font-size: 8px;"></i> Interrompu`;
    }

    function highlightErrorLine(lineNum) {
        errorDecorations = monacoEditor.deltaDecorations(errorDecorations, [
            {
                range: new monaco.Range(lineNum, 1, lineNum, 1),
                options: {
                    isWholeLine: true,
                    className: 'error-line-highlight'
                }
            }
        ]);
        monacoEditor.revealLineInCenter(lineNum);
    }

    function clearErrorHighlight() {
        errorDecorations = monacoEditor.deltaDecorations(errorDecorations, []);
        const errCard = document.getElementById('error-card-element');
        if (errCard) errCard.remove();
    }

    function renderErrorCard(msg) {
        const consoleOut = document.getElementById('console-output');
        const card = document.createElement('div');
        card.id = 'error-card-element';
        card.className = 'error-card';
        card.innerHTML = `
            <div class="error-card-header">
                <span>🚨 Ligne d'erreur surlignée dans l'éditeur</span>
                <button class="error-copy-btn" onclick="copyErrorToClipboard()">📋 Copier l'erreur</button>
            </div>
            <div>${msg}</div>
        `;
        consoleOut.appendChild(card);
        consoleOut.scrollTop = consoleOut.scrollHeight;
    }

    function copyErrorToClipboard() {
        navigator.clipboard.writeText(fullConsoleHistory).then(() => alert("Traceback d'erreur copié !"));
    }

    function setViewMode(mode) {
        const workspace = document.getElementById('workspace');
        workspace.classList.remove('mode-editor', 'mode-console');
        if (mode === 'editor') workspace.classList.add('mode-editor');
        if (mode === 'console') workspace.classList.add('mode-console');
        setTimeout(() => { if (monacoEditor) monacoEditor.layout(); }, 50);
    }

    function clearConsole() {
        document.getElementById('console-output').innerHTML = '';
        fullConsoleHistory = "";
        clearErrorHighlight();
        setWaitingInputState(false);
    }

    function renderFileTree() {
        const tree = document.getElementById('file-tree');
        tree.innerHTML = '';
        for (let fname in files) {
            const isEntry = (fname === entrypointFile);
            const item = document.createElement('div');
            item.className = `file-item ${fname === activeFile ? 'active' : ''} ${isEntry ? 'is-entrypoint' : ''}`;
            item.innerHTML = `
                <span onclick="switchFile('${fname}')">
                    <i class="fa-regular ${isEntry ? 'fa-rocket' : 'fa-file-code'}"></i> ${fname}
                </span>
                <div class="file-actions">
                    <i class="fa-solid fa-rocket" onclick="setEntrypoint('${fname}')" title="Définir comme point d'entrée"></i>
                    <i class="fa-solid fa-pen" onclick="renameFile('${fname}')" title="Renommer"></i>
                    ${Object.keys(files).length > 1 ? `<i class="fa-solid fa-trash delete-icon" onclick="deleteFile('${fname}')" title="Supprimer"></i>` : ''}
                </div>
            `;
            tree.appendChild(item);
        }
        document.getElementById('entrypoint-status').innerHTML = `<i class="fa-solid fa-rocket"></i> Entrée: ${entrypointFile}`;
    }

    function renderTabs() {
        const tabsBar = document.getElementById('tabs-bar');
        tabsBar.innerHTML = '';
        for (let fname in files) {
            const tab = document.createElement('div');
            tab.className = `tab ${fname === activeFile ? 'active' : ''}`;
            tab.innerHTML = `
                <span onclick="switchFile('${fname}')"><i class="fa-brands fa-python"></i> ${fname}</span>
                ${Object.keys(files).length > 1 ? `<i class="fa-solid fa-xmark tab-close" onclick="deleteFile('${fname}')"></i>` : ''}
            `;
            tabsBar.appendChild(tab);
        }
    }

    function switchFile(fname) {
        if (!files[fname]) return;
        files[activeFile] = monacoEditor.getValue();
        activeFile = fname;
        
        if (!fileModels[fname]) {
            fileModels[fname] = monaco.editor.createModel(files[fname], 'python');
        }
        monacoEditor.setModel(fileModels[activeFile]);
        renderFileTree();
        renderTabs();
        checkSyntax();
    }

    function setEntrypoint(fname) {
        entrypointFile = fname;
        renderFileTree();
    }

    function promptNewFile() {
        const fname = prompt("Nom du nouveau fichier :", "script.py");
        if (fname && fname.trim()) {
            const name = fname.trim();
            if (files[name]) return alert("Ce fichier existe déjà.");
            files[name] = "# Fichier " + name + "\n";
            fileModels[name] = monaco.editor.createModel(files[name], 'python');
            switchFile(name);
        }
    }

    function renameFile(oldName) {
        const newName = prompt("Nouveau nom :", oldName);
        if (newName && newName.trim() && newName.trim() !== oldName) {
            const name = newName.trim();
            files[name] = monacoEditor.getValue();
            delete files[oldName];
            
            if (fileModels[oldName]) fileModels[oldName].dispose();
            fileModels[name] = monaco.editor.createModel(files[name], 'python');
            
            if (activeFile === oldName) activeFile = name;
            if (entrypointFile === oldName) entrypointFile = name;

            switchFile(activeFile);
        }
    }

    function deleteFile(fname) {
        if (Object.keys(files).length <= 1) return alert("Impossible de supprimer le dernier fichier.");
        if (confirm(`Supprimer ${fname} ?`)) {
            delete files[fname];
            if (fileModels[fname]) {
                fileModels[fname].dispose();
                delete fileModels[fname];
            }
            if (activeFile === fname) activeFile = Object.keys(files)[0];
            if (entrypointFile === fname) entrypointFile = activeFile;
            
            switchFile(activeFile);
        }
    }

    function createNewProject() {
        currentProjectId = null;
        document.getElementById('project-name').value = "Nouveau Projet";
        entrypointFile = "main.py";
        files = {
            'main.py': '# Fichier principal\nprint("Hello World!")\n'
        };
        activeFile = 'main.py';
        initModels();
        renderFileTree();
        renderTabs();
        loadProjectList();
    }

    async function saveProjectToDB() {
        const name = document.getElementById('project-name').value.trim();
        files[activeFile] = monacoEditor.getValue();
        
        const res = await fetch('/api/save_project', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                id: currentProjectId,
                name: name,
                files: files,
                entrypoint: entrypointFile
            })
        });
        const data = await res.json();
        if (data.status === 'success') {
            currentProjectId = data.id;
            alert(`Projet "${data.name}" sauvegardé avec succès !`);
            loadProjectList();
        } else {
            alert("Erreur lors de la sauvegarde: " + (data.error || "Inconnu"));
        }
    }

    async function loadProjectList() {
        const res = await fetch('/api/projects');
        const projects = await res.json();
        const listEl = document.getElementById('project-list');
        listEl.innerHTML = '';

        projects.forEach(p => {
            const item = document.createElement('div');
            item.className = `project-item ${p.id === currentProjectId ? 'active-proj' : ''}`;
            item.innerHTML = `
                <span onclick="loadProjectFromDB(${p.id})"><i class="fa-solid fa-folder"></i> ${p.name}</span>
                <i class="fa-solid fa-trash delete-icon" onclick="deleteProjectFromDB(event, ${p.id})" title="Supprimer le projet"></i>
            `;
            listEl.appendChild(item);
        });
    }

    async function loadProjectFromDB(id) {
        const res = await fetch(`/api/load_project/${id}`);
        if (!res.ok) return alert("Projet introuvable.");
        const data = await res.json();

        currentProjectId = data.id;
        document.getElementById('project-name').value = data.name;
        files = data.files;
        entrypointFile = data.entrypoint || Object.keys(files)[0];
        activeFile = entrypointFile;

        initModels();
        renderFileTree();
        renderTabs();
        loadProjectList();
        checkSyntax();
    }

    async function deleteProjectFromDB(e, id) {
        e.stopPropagation();
        if (!confirm("Voulez-vous vraiment supprimer ce projet de la base de données ?")) return;

        const res = await fetch(`/api/delete_project/${id}`, { method: 'DELETE' });
        if (res.ok) {
            if (currentProjectId === id) createNewProject();
            else loadProjectList();
        }
    }

    let syntaxTimer = null;
    function debounceSyntaxCheck() {
        clearTimeout(syntaxTimer);
        syntaxTimer = setTimeout(checkSyntax, 300);
    }

    async function checkSyntax() {
        const code = monacoEditor.getValue();
        const res = await fetch('/syntax_check', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ code: code, filename: activeFile })
        });
        const data = await res.json();
        
        const syntaxStatus = document.getElementById('syntax-status');
        if (data.valid) {
            monaco.editor.setModelMarkers(fileModels[activeFile], 'owner', []);
            syntaxStatus.innerHTML = `<i class="fa-solid fa-check-double" style="color: var(--accent-green);"></i> Syntaxe OK`;
        } else {
            monaco.editor.setModelMarkers(fileModels[activeFile], 'owner', [{
                startLineNumber: data.line,
                startColumn: data.column,
                endLineNumber: data.line,
                endColumn: data.column + 10,
                message: data.msg,
                severity: monaco.MarkerSeverity.Error
            }]);
            syntaxStatus.innerHTML = `<i class="fa-solid fa-triangle-exclamation" style="color: var(--accent-red);"></i> Erreur Ligne ${data.line}`;
        }
    }

    function openPipModal() { document.getElementById('pip-modal').style.display = 'flex'; }
    function closePipModal() { document.getElementById('pip-modal').style.display = 'none'; }

    async function installPipPackage() {
        const pkg = document.getElementById('pip-package-input').value.trim();
        if (!pkg) return;
        closePipModal();
        
        const consoleOut = document.getElementById('console-output');
        consoleOut.innerText = `📦 Installation de ${pkg} via pip...\n`;
        
        const res = await fetch('/install_package', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ package: pkg })
        });
        const data = await res.json();
        consoleOut.innerText += data.output;
    }
</script>
